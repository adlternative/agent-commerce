<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6e5b" />
    <title>离线 · Agent Commerce</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0b1f1c;
        --sea: #0f6e5b;
        --sand: #f3ebe0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 10% -10%, #9fd6c6 0%, transparent 55%),
          linear-gradient(180deg, #eef6f2 0%, var(--sand) 100%);
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
        color: var(--sea);
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
      }
      a {
        color: var(--sea);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>Agent Commerce 的应用壳已缓存，但下单与支付需要连接 API。恢复网络后重试。</p>
      <p><a href="/">重新加载</a></p>
    </main>
  </body>
</html>
