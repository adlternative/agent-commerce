# Minimal Prometheus scrape config for Agent Commerce (ACP-38).
# Scrapes the API on the compose network — not via the public Caddy hostname.
# /metrics must stay off the public internet (Caddy responds 404 for /metrics).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agent-commerce
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8787"]
