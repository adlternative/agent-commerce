# One-command local stack: API (+ Vite dist static) with persistent DATA_DIR volume.
# JWT_SECRET is required (no insecure default). Generate: openssl rand -hex 32
# Demo opaque tokens stay off unless ALLOW_DEMO_TOKENS=1 (production default: 0).
services:
  api:
    build: .
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: /app/data
      STATIC_DIR: /app/dist
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET — e.g. export JWT_SECRET=$$(openssl rand -hex 32)}
      ALLOW_DEMO_TOKENS: ${ALLOW_DEMO_TOKENS:-0}
    volumes:
      - commerce-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Optional separate static front if you prefer not to use STATIC_DIR on api.
  # Default compose uses api-only (static-serves dist). Uncomment to split:
  # web:
  #   image: nginx:1.27-alpine
  #   ports:
  #     - "5173:80"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  commerce-data:
