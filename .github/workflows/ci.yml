name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build:server
      - name: npm test
        env:
          # Fail-closed JWT: smoke/e2e spawn the compiled server and use demo tokens.
          JWT_SECRET: agent-commerce-ci-jwt-secret
          ALLOW_DEMO_TOKENS: '1'
        run: npm test
      - name: MCP Streamable HTTP client smoke
        run: npm run test:mcp:http
      - run: npm run openapi:check
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build smoke
        run: docker build -t agent-commerce:ci .
